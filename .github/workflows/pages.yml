# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end laptop-mode session (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &)
          sleep 5
          mkdir -p e2e-shots
          node test/laptop-e2e.mjs https://localhost:4173/ e2e-shots
          node test/landing-e2e.mjs https://localhost:4173/ e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
